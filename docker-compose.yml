services:
  postgres:
    image: postgres:16-alpine
    container_name: psychgen_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psychgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psychgen}
      POSTGRES_DB: ${POSTGRES_DB:-psychgen}
    volumes:
      - psychgen_pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psychgen} -d ${POSTGRES_DB:-psychgen}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  r-engine:
    build:
      context: ./docker/r-engine
      dockerfile: Dockerfile
    container_name: psychgen_r_engine
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${AI_INTEGRATIONS_OPENAI_API_KEY:-}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${AI_INTEGRATIONS_OPENAI_BASE_URL:-}
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: ${AI_INTEGRATIONS_ANTHROPIC_API_KEY:-}
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: ${AI_INTEGRATIONS_ANTHROPIC_BASE_URL:-}
      R_LIBS_USER: /home/r/.R/library-4.4
    volumes:
      # Persistent CRAN library — packages survive `docker compose down`.
      - psychgen_r_lib:/home/r/.R/library-4.4
      # udpipe model cache (Portuguese-Bosque, ~17 MB) survives restarts.
      - psychgen_r_cache:/home/r/.cache
      # Mount the R scripts read-only so editing them doesn't require rebuild.
      - ./artifacts/api-server/r-scripts:/srv/r-scripts:ro
    ports:
      # Optional — exposed for direct curl debugging. Internal traffic uses
      # the docker network on `r-engine:8000`.
      - "${R_ENGINE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    container_name: psychgen_api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-psychgen}:${POSTGRES_PASSWORD:-psychgen}@postgres:5432/${POSTGRES_DB:-psychgen}
      R_ENGINE_URL: http://r-engine:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${AI_INTEGRATIONS_OPENAI_API_KEY:-}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${AI_INTEGRATIONS_OPENAI_BASE_URL:-}
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: ${AI_INTEGRATIONS_ANTHROPIC_API_KEY:-}
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: ${AI_INTEGRATIONS_ANTHROPIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      r-engine:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: artifacts/psychgen-br/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: psychgen_web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  psychgen_pg_data:
  psychgen_r_lib:
  psychgen_r_cache:
